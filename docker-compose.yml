services:
  db:
    image: postgres:15-alpine
    container_name: paint_db
    environment:
      POSTGRES_USER: loomi_user
      POSTGRES_PASSWORD: loomi123
      POSTGRES_DB: back_ia_loomi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomi_user -d back_ia_loomi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: paint_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://loomi_user:loomi123@db:5432/back_ia_loomi
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

volumes:
  postgres_data:
